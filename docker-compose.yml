# Production build of the app + the mock API.
#   docker compose up --build   ->   http://localhost:8080
services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped

  web:
    build: .
    ports:
      - '8080:80'
    depends_on:
      - api
    restart: unless-stopped
