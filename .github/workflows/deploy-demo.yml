name: Deploy demo

# Publishes the demo build (in-browser mock API) to GitHub Pages.
# One-time setup: repository Settings → Pages → Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Pages serves the site from /<repo>/, so the base href must match.
      - run: npm run build:demo -- --base-href "/${{ github.event.repository.name }}/"

      # Pages has no SPA fallback: serve index.html for unknown paths (deep links, refresh).
      - run: cp dist/task-dashboard/browser/index.html dist/task-dashboard/browser/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/task-dashboard/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
