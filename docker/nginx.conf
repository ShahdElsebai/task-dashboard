server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Same contract as the dev proxy (proxy.conf.json): /api/tasks -> api:3000/tasks.
  location /api/ {
    proxy_pass http://api:3000/;
    proxy_set_header Host $host;
  }

  # File names contain a content hash, so they can be cached for a year.
  location ~* \.(?:js|css|woff2?|png|svg|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Translations change without a hash in the name.
  location /assets/i18n/ {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # Client-side routes (/dashboard, /team …) all load index.html, which must never be cached.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
