<div
  class="flex flex-col items-center justify-center gap-3 rounded-lg border border-surface-200 p-6 text-center"
  role="alert"
>
  <i class="pi pi-exclamation-triangle text-2xl text-red-600" aria-hidden="true"></i>
  <p class="m-0 text-surface-700">{{ messageKey() | translate }}</p>
  @if (retryable()) {
    <p-button icon="pi pi-refresh" severity="secondary" [label]="'common.retry' | translate" (onClick)="retry.emit()" />
  }
</div>
