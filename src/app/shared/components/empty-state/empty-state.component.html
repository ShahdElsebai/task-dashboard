<div class="flex flex-col items-center justify-center gap-3 p-8 text-center">
  <i aria-hidden="true" [class]="icon() + ' text-4xl text-surface-400'"></i>
  <h2 class="m-0 text-lg font-semibold text-text-default">{{ titleKey() | translate }}</h2>
  @if (messageKey(); as key) {
    <p class="m-0 max-w-md text-sm text-text-secondary">{{ key | translate }}</p>
  }
  <ng-content />
</div>
