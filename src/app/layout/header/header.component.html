<header
  class="flex h-16 items-center gap-2 border-b border-surface-200 bg-surface-0 px-3 shadow-sm sm:gap-4 sm:px-4 lg:px-6"
>
  <p-button
    class="lg:hidden"
    icon="pi pi-bars"
    severity="secondary"
    [text]="true"
    [ariaLabel]="'header.openMenu' | translate"
    (onClick)="menuToggle.emit()"
  />

  <a
    class="flex shrink-0 items-center gap-2 text-primary no-underline"
    routerLink="/dashboard"
    [attr.aria-label]="'app.title' | translate"
  >
    <span class="flex size-8 items-center justify-center rounded-md bg-primary text-primary-contrast">
      <i class="pi pi-check-square" aria-hidden="true"></i>
    </span>
    <span class="hidden whitespace-nowrap text-xl font-semibold md:inline">{{ 'app.title' | translate }}</span>
  </a>

  <div class="mx-auto min-w-0 max-w-md flex-1">
    <p-iconfield>
      <p-inputicon class="pi pi-search" />
      <input
        #searchInput
        class="w-full"
        pInputText
        type="search"
        [placeholder]="'header.searchPlaceholder' | translate"
        [attr.aria-label]="'header.searchPlaceholder' | translate"
        [value]="search.query()"
        (input)="onSearch(searchInput.value)"
      />
    </p-iconfield>
  </div>

  <div class="flex shrink-0 items-center gap-1">
    <p-button
      class="[&_.p-button-label]:hidden sm:[&_.p-button-label]:inline"
      icon="pi pi-globe"
      severity="secondary"
      [ariaLabel]="'common.switchLanguage' | translate"
      [label]="'common.switchLanguage' | translate"
      [text]="true"
      (onClick)="language.toggle()"
    />
    <p-button
      class="hidden sm:inline-flex"
      icon="pi pi-bell"
      severity="secondary"
      [text]="true"
      [rounded]="true"
      [ariaLabel]="'header.notifications' | translate"
    />
    <app-user-avatar [user]="currentUser" />
  </div>
</header>
