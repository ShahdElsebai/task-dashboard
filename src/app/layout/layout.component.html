<div class="flex min-h-screen flex-col">
  <header class="flex items-center justify-between border-b border-surface-200 px-6 py-4">
    <h1 class="text-xl font-semibold">{{ 'app.title' | translate }}</h1>
    <p-button
      [label]="'common.switchLanguage' | translate"
      icon="pi pi-globe"
      severity="secondary"
      [text]="true"
      (onClick)="language.toggle()"
    />
  </header>

  <main class="flex-1 p-6">
    <router-outlet />
  </main>
</div>
