<a
  class="sr-only z-50 rounded bg-primary px-4 py-2 text-primary-contrast focus:not-sr-only focus:fixed focus:start-2 focus:top-2"
  href="#main"
>
  {{ 'common.skipToContent' | translate }}
</a>

<app-header class="sticky top-0 z-20 block" (menuToggle)="menuOpen.set(true)" />

<div class="flex min-h-[calc(100dvh-4rem)]">
  <aside
    class="sticky top-16 hidden h-[calc(100dvh-4rem)] w-60 shrink-0 self-start overflow-y-auto border-e border-surface-200 bg-surface-0 lg:block"
  >
    <app-sidebar />
  </aside>

  <p-drawer [header]="'app.title' | translate" [visible]="menuOpen()" (visibleChange)="menuOpen.set($event)">
    <app-sidebar (navigate)="menuOpen.set(false)" />
  </p-drawer>

  <main class="min-w-0 flex-1 p-4 lg:p-6" id="main" tabindex="-1">
    <router-outlet />
  </main>
</div>
