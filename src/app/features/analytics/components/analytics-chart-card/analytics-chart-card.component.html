<section
  class="flex h-full flex-col gap-4 rounded-xl bg-surface-0 p-5 shadow-sm"
  [attr.aria-label]="titleKey() | translate"
>
  <h2 class="text-base font-semibold text-surface-900">{{ titleKey() | translate }}</h2>

  @if (total() === 0) {
    <p class="py-16 text-center text-sm text-surface-500">{{ 'analytics.noData' | translate }}</p>
  } @else {
    <div class="relative h-64">
      <p-chart height="100%" [ariaLabel]="summary()" [data]="data()" [options]="options()" [type]="kind()" />
    </div>

    <ul class="flex flex-wrap justify-center gap-x-5 gap-y-2 text-sm">
      @for (item of legend(); track item.label) {
        <li class="flex items-center gap-2">
          <span aria-hidden="true" [class]="item.swatchClass"></span>
          <span class="text-surface-700">{{ item.label }}</span>
          <span class="font-semibold text-surface-900">{{ item.value }}</span>
          <span class="text-surface-500">({{ item.percent }}%)</span>
        </li>
      }
    </ul>
  }
</section>
