<div class="flex flex-col gap-6">
  <h1 class="text-2xl font-semibold text-surface-900">{{ 'analytics.title' | translate }}</h1>

  @if (state.error()) {
    <app-error-state (retry)="state.reload()" />
  } @else if (chartsLoading()) {
    <div class="grid grid-cols-1 gap-4 lg:grid-cols-2" aria-hidden="true">
      <p-skeleton borderRadius="0.75rem" height="22rem" />
      <p-skeleton borderRadius="0.75rem" height="22rem" />
    </div>
  } @else {
    <div class="grid grid-cols-1 gap-4 lg:grid-cols-2">
      <app-analytics-chart-card kind="doughnut" titleKey="analytics.byStatus" [slices]="state.byStatus()" />
      <app-analytics-chart-card kind="bar" titleKey="analytics.byPriority" [slices]="state.byPriority()" />
    </div>
  }

  @if (state.activitiesError()) {
    <app-error-state (retry)="state.reloadActivities()" />
  } @else if (activityLoading()) {
    <p-skeleton borderRadius="0.75rem" height="20rem" />
  } @else {
    <app-activity-feed [activities]="state.activities()" />
  }
</div>
