<article
  class="group relative flex flex-col gap-3 rounded-lg border border-surface-200 bg-surface-0 p-4 transition-shadow hover:shadow-md"
  [class.border-s-4]="overdue()"
  [class.!border-s-status-overdue]="overdue()"
  [class.!bg-status-overdue-bg]="overdue()"
  [attr.aria-label]="task().title"
>
  <div class="flex items-start justify-between">
    <app-board-priority-badge [priority]="task().priority" />
    <p-button
      icon="pi pi-ellipsis-v"
      severity="secondary"
      size="small"
      [text]="true"
      [rounded]="true"
      [ariaLabel]="'tasks.actions' | translate"
      (onClick)="menu.toggle($event)"
    />
  </div>
  <p-menu #menu appendTo="body" [model]="menuItems()" [popup]="true" />

  <div>
    <h3 class="m-0 text-base font-semibold text-text-default">{{ task().title }}</h3>
    @if (task().description) {
      <p class="m-0 mt-1 line-clamp-2 text-sm text-text-secondary">{{ task().description }}</p>
    }
  </div>

  <p
    class="m-0 flex items-center gap-1 text-xs text-text-secondary"
    [class.!text-status-overdue]="overdue()"
    [class.!text-status-done]="due().tone === 'done'"
  >
    <i aria-hidden="true" [class]="due().icon"></i>
    {{ due().key | translate: due().params }}
  </p>

  @if (task().tags.length) {
    <ul class="m-0 flex list-none flex-wrap gap-2 p-0 text-xs text-text-secondary">
      @for (tag of task().tags; track tag) {
        <li>{{ tag }}</li>
      }
    </ul>
  }

  <div class="border-t border-surface-200 pt-3">
    <app-user-avatar [showName]="true" [user]="task().assignee" />
  </div>
</article>
