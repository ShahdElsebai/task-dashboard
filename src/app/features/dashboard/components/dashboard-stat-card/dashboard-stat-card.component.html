<article class="flex h-full flex-col gap-4 rounded-xl bg-surface-0 p-4 shadow-sm sm:p-6">
  <p class="m-0 flex items-center gap-2 text-sm text-text-secondary">
    <i aria-hidden="true" [class]="stat().icon + ' ' + stat().iconClass"></i>
    {{ stat().titleKey | translate }}
  </p>
  <p class="m-0 text-2xl font-bold text-text-default sm:text-3xl">{{ stat().value ?? '—' }}</p>
  @if (stat().value !== null) {
    <p
      class="m-0 text-xs text-text-secondary"
      [class.text-trend-up]="stat().changeType === Change.Positive"
      [class.text-trend-down]="stat().changeType === Change.Negative"
    >
      @if (stat().change !== '0') {
        {{ stat().change }}
      }
      {{ stat().changeLabel | translate }}
    </p>
  }
</article>
