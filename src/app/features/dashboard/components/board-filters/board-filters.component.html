<div class="flex flex-wrap items-center gap-3 rounded-xl bg-surface-0 p-4 shadow-sm">
  <p-selectbutton
    class="max-w-full overflow-x-auto [&_.p-togglebutton]:whitespace-nowrap"
    optionLabel="label"
    optionValue="value"
    [allowEmpty]="false"
    [ariaLabel]="'filters.status' | translate"
    [ngModel]="status()"
    [options]="statusOptions()"
    (ngModelChange)="status.set($event)"
  />

  <div class="grid w-full grid-cols-2 items-center gap-3 sm:ms-auto sm:flex sm:w-auto">
    <p-select
      class="min-w-0"
      optionLabel="label"
      optionValue="value"
      [ariaLabel]="'filters.priority' | translate"
      [ngModel]="priority()"
      [options]="priorityOptions()"
      [placeholder]="'filters.priority' | translate"
      [showClear]="true"
      (ngModelChange)="priority.set($event ?? null)"
    />
    <p-select
      class="min-w-0"
      optionLabel="name"
      optionValue="id"
      [ariaLabel]="'filters.assignee' | translate"
      [ngModel]="assigneeId()"
      [options]="users()"
      [placeholder]="'filters.assignee' | translate"
      [showClear]="true"
      (ngModelChange)="assigneeId.set($event ?? null)"
    />
    <p-button
      class="col-span-2"
      icon="pi pi-plus"
      styleClass="w-full sm:w-auto"
      [label]="'tasks.new' | translate"
      (onClick)="newTask.emit()"
    />
  </div>
</div>
