<section
  class="flex min-w-0 flex-col rounded-xl bg-surface-0 p-4 shadow-sm"
  [attr.aria-labelledby]="'col-' + column().status"
>
  <header class="mb-4 flex items-center justify-between border-b-2 border-surface-200 pb-3">
    <h2 class="m-0 text-sm font-bold uppercase tracking-wide text-text-default" [id]="'col-' + column().status">
      {{ column().titleKey | translate }}
    </h2>
    <span class="rounded-full bg-surface-200 px-2 py-0.5 text-xs font-semibold text-text-default">
      {{ column().tasks.length }}
    </span>
  </header>

  <ul
    class="m-0 flex min-h-24 list-none flex-col gap-4 p-0"
    cdkDropList
    [cdkDropListData]="column().status"
    (cdkDropListDropped)="onDrop($event)"
  >
    @for (task of column().tasks; track task.id) {
      <li cdkDrag [cdkDragData]="task">
        <app-board-task-card
          [canMoveDown]="!$last"
          [canMoveUp]="!$first"
          [labels]="labels()"
          [task]="task"
          (edit)="edit.emit($event)"
          (moveTo)="moveTo(task, $event)"
          (remove)="remove.emit($event)"
          (reorder)="reorder(task, $index, $event)"
        />
        <div *cdkDragPlaceholder class="min-h-24 rounded-lg border-2 border-dashed border-primary bg-primary-50"></div>
      </li>
    } @empty {
      <li>
        <app-empty-state icon="pi pi-inbox" titleKey="board.emptyColumn" />
      </li>
    }
  </ul>
</section>
