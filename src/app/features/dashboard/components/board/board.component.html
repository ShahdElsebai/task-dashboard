<div class="flex flex-col gap-6">
  <app-board-filters
    [assigneeId]="board.filters().assigneeId"
    [priority]="board.filters().priority"
    [status]="statusFilter()"
    [users]="users.users()"
    (assigneeIdChange)="board.setFilters({ assigneeId: $event })"
    (newTask)="openTask('new')"
    (priorityChange)="board.setFilters({ priority: $event })"
    (statusChange)="onStatusChange($event)"
  />

  @if (tasks.error()) {
    <app-error-state (retry)="tasks.reload()" />
  } @else if (isFirstLoad()) {
    <app-dashboard-skeleton variant="columns" />
  } @else {
    <div
      class="grid grid-cols-1 items-start gap-4 md:grid-cols-3"
      cdkDropListGroup
      [class.md:grid-cols-1]="board.visibleColumns().length === 1"
    >
      @for (column of board.visibleColumns(); track column.status) {
        <app-board-column
          [column]="column"
          [labels]="menuLabels()"
          (edit)="openTask($event.id)"
          (move)="onMove($event)"
          (remove)="confirmDelete($event)"
        />
      }
    </div>
  }
</div>

<app-board-task-form-dialog
  [open]="dialogOpen()"
  [saving]="saving()"
  [task]="editingTask()"
  [users]="users.users()"
  (closed)="closeTask()"
  (save)="saveTask($event)"
/>

<p-confirmdialog [closeAriaLabel]="'common.close' | translate" />
