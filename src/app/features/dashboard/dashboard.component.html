<div class="flex flex-col gap-6">
  <h1 class="sr-only">{{ 'nav.dashboard' | translate }}</h1>
  <section [attr.aria-label]="'stats.label' | translate">
    @if (isFirstLoad()) {
      <app-dashboard-skeleton variant="stats" />
    } @else {
      <div class="grid grid-cols-2 gap-3 sm:gap-4 xl:grid-cols-4">
        @for (card of dashboard.statCards(); track card.id) {
          <app-dashboard-stat-card [stat]="card" />
        }
      </div>
    }
  </section>

  <app-board />
</div>
